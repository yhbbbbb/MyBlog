<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">存储与计算技术演进</title><desc id="desc">从单机存储和脚本，演进到 HDFS、MapReduce、Spark、云对象存储和 Flink 的组合。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 Q5 4 10 6 Q5 8 1 11" fill="none" stroke="#4d5555" stroke-width="1.8"/></marker><style>.t{font:700 27px 'Segoe Print','Microsoft YaHei',sans-serif;fill:#273333;text-anchor:middle}.l{font:600 18px 'Segoe Print','Microsoft YaHei',sans-serif;fill:#303b3b;text-anchor:middle}.s{font:15px 'Segoe Print','Microsoft YaHei',sans-serif;fill:#536060;text-anchor:middle}.b{stroke:#435051;stroke-width:2.4}.ar{fill:none;stroke:#4d5555;stroke-width:2.5;marker-end:url(#a);stroke-linecap:round}.g{fill:none;stroke:#8a6c50;stroke-width:2.2;stroke-dasharray:9 7;marker-end:url(#a)}</style></defs><rect width="1200" height="520" rx="18" fill="#fffdf8"/><text x="600" y="45" class="t">存储与计算的技术演进</text><text x="170" y="95" class="l">早期</text><text x="600" y="95" class="l">分布式阶段</text><text x="1030" y="95" class="l">云原生与实时阶段</text><rect x="70" y="140" width="200" height="100" rx="16" fill="#d9e9e7" class="b"/><text x="170" y="178" class="l">单机文件</text><text x="170" y="207" class="s">脚本 · 单机数据库</text><rect x="330" y="140" width="210" height="100" rx="16" fill="#dbe7f3" class="b"/><text x="435" y="178" class="l">HDFS</text><text x="435" y="207" class="s">Block · 副本 · 横向扩展</text><rect x="600" y="140" width="210" height="100" rx="16" fill="#e5dcef" class="b"/><text x="705" y="178" class="l">对象存储</text><text x="705" y="207" class="s">存储与计算解耦</text><rect x="870" y="140" width="260" height="100" rx="16" fill="#dcebd9" class="b"/><text x="1000" y="178" class="l">数据湖 / 湖仓</text><text x="1000" y="207" class="s">表格式 · 快照 · 事务</text><path d="M270 190 L330 190" class="ar"/><path d="M540 190 L600 190" class="ar"/><path d="M810 190 L870 190" class="ar"/><rect x="80" y="330" width="200" height="90" rx="16" fill="#f2dfb9" class="b"/><text x="180" y="367" class="l">脚本批处理</text><text x="180" y="395" class="s">单机 CPU</text><rect x="330" y="330" width="210" height="90" rx="16" fill="#f0dcdc" class="b"/><text x="435" y="367" class="l">MapReduce</text><text x="435" y="395" class="s">磁盘批处理 · 容错</text><rect x="600" y="330" width="210" height="90" rx="16" fill="#e7dfd2" class="b"/><text x="705" y="367" class="l">Spark</text><text x="705" y="395" class="s">DAG · 内存 · SQL</text><rect x="870" y="330" width="260" height="90" rx="16" fill="#d9e9e7" class="b"/><text x="1000" y="367" class="l">Flink</text><text x="1000" y="395" class="s">事件时间 · 状态 · 流</text><path d="M280 375 L330 375" class="ar"/><path d="M540 375 L600 375" class="ar"/><path d="M810 375 L870 375" class="ar"/><path d="M705 240 L705 330" class="g"/><text x="705" y="285" class="s">存算解耦 + 多引擎</text></svg>
