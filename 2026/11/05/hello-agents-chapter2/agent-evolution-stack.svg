<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">从大语言模型到现代 Agent 的能力叠加</title><desc id="desc">现代 Agent 在大语言模型基础上逐层增加结构化输出、工具调用、RAG、记忆、工作流和多 Agent 协作。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 Q5 4 10 6 Q5 8 1 11" fill="none" stroke="#64748b" stroke-width="2"/></marker><style>.t{font:700 28px 'Microsoft YaHei',sans-serif;fill:#1e40af;text-anchor:middle}.l{font:600 19px 'Microsoft YaHei',sans-serif;fill:#374151;text-anchor:middle}.s{font:15px 'Microsoft YaHei',sans-serif;fill:#64748b;text-anchor:middle}.b{stroke-width:2.5}.ar{fill:none;stroke:#64748b;stroke-width:2.6;marker-end:url(#a);stroke-linecap:round}</style></defs><rect width="1100" height="560" rx="18" fill="#fffdf8"/><text x="550" y="45" class="t">Agent 是逐层叠加的系统能力</text><rect x="95" y="410" width="910" height="75" rx="18" fill="#dbeafe" stroke="#1e3a5f" class="b"/><text x="550" y="443" class="l">LLM：理解语言、生成文本、提出候选决策</text><text x="550" y="468" class="s">基础能力，不等于完整应用</text><rect x="150" y="325" width="800" height="65" rx="16" fill="#ddd6fe" stroke="#6d28d9" class="b"/><text x="550" y="365" class="l">结构化输出：JSON / 函数参数 / 可校验动作</text><rect x="205" y="240" width="690" height="65" rx="16" fill="#fed7aa" stroke="#c2410c" class="b"/><text x="550" y="280" class="l">工具调用：搜索、数据库、API、代码与文件</text><rect x="260" y="155" width="580" height="65" rx="16" fill="#fef3c7" stroke="#b45309" class="b"/><text x="550" y="195" class="l">RAG + 记忆：外部知识与任务状态</text><rect x="315" y="80" width="470" height="55" rx="15" fill="#dcebd9" stroke="#047857" class="b"/><text x="550" y="115" class="l">工作流 / 多 Agent：编排、复核与恢复</text><path d="M550 410 L550 390" class="ar"/><path d="M550 325 L550 305" class="ar"/><path d="M550 240 L550 220" class="ar"/><path d="M550 155 L550 135" class="ar"/><text x="550" y="525" class="s">能力越强，越需要权限、停止条件、日志、评估与回滚</text></svg>
