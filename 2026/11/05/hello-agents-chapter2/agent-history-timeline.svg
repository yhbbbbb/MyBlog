<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">智能体技术发展时间线</title><desc id="desc">从符号主义和专家系统，到神经网络、强化学习、Transformer、大语言模型和现代智能体的主要演进节点。</desc><defs><style>.t{font:700 28px 'Microsoft YaHei',sans-serif;fill:#1e40af;text-anchor:middle}.l{font:600 18px 'Microsoft YaHei',sans-serif;fill:#374151;text-anchor:middle}.s{font:15px 'Microsoft YaHei',sans-serif;fill:#64748b;text-anchor:middle}.line{stroke:#64748b;stroke-width:4}.dot{stroke-width:3}</style></defs><rect width="1200" height="520" rx="18" fill="#fffdf8"/><text x="600" y="48" class="t">智能体技术发展的主线</text><line x1="95" y1="270" x2="1110" y2="270" class="line"/><circle cx="130" cy="270" r="16" fill="#fed7aa" stroke="#c2410c" class="dot"/><circle cx="315" cy="270" r="16" fill="#fef3c7" stroke="#b45309" class="dot"/><circle cx="500" cy="270" r="16" fill="#dbeafe" stroke="#1e3a5f" class="dot"/><circle cx="685" cy="270" r="16" fill="#ddd6fe" stroke="#6d28d9" class="dot"/><circle cx="870" cy="270" r="16" fill="#e5dcef" stroke="#6d28d9" class="dot"/><circle cx="1055" cy="270" r="16" fill="#dcebd9" stroke="#047857" class="dot"/><path d="M130 254 L130 145 M315 286 L315 405 M500 254 L500 145 M685 286 L685 405 M870 254 L870 145 M1055 286 L1055 405" class="line" stroke-width="2"/><text x="130" y="115" class="l">符号主义</text><text x="130" y="140" class="s">规则与逻辑</text><text x="315" y="435" class="l">专家系统</text><text x="315" y="460" class="s">知识库与推理机</text><text x="500" y="115" class="l">神经网络</text><text x="500" y="140" class="s">从数据学习表示</text><text x="685" y="435" class="l">强化学习</text><text x="685" y="460" class="s">状态、动作、奖励</text><text x="870" y="115" class="l">Transformer / LLM</text><text x="870" y="140" class="s">语言理解与生成</text><text x="1055" y="435" class="l">现代 Agent</text><text x="1055" y="460" class="s">工具、状态、记忆、边界</text><text x="600" y="335" class="s">知识表示 → 数据学习 → 环境行动 → 工具编排</text></svg>
