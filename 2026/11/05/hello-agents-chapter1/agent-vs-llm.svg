<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">语言模型与智能体系统对比</title><desc id="desc">语言模型主要完成输入到文本的生成，智能体在模型外增加状态、工具、记忆、执行器和反馈循环。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 Q5 4 10 6 Q5 8 1 11" fill="none" stroke="#64748b" stroke-width="2"/></marker><style>.t{font:700 28px 'Microsoft YaHei',sans-serif;fill:#1e40af;text-anchor:middle}.l{font:600 19px 'Microsoft YaHei',sans-serif;fill:#374151;text-anchor:middle}.s{font:16px 'Microsoft YaHei',sans-serif;fill:#64748b;text-anchor:middle}.b{stroke-width:2.5}.ar{fill:none;stroke:#64748b;stroke-width:2.6;marker-end:url(#a);stroke-linecap:round}</style></defs><rect width="1000" height="470" rx="18" fill="#fffdf8"/><text x="500" y="45" class="t">从模型调用到 Agent 系统</text><rect x="70" y="95" width="350" height="290" rx="22" fill="#eff6ff" stroke="#1e3a5f" class="b"/><text x="245" y="135" class="l">语言模型</text><rect x="135" y="190" width="220" height="80" rx="16" fill="#ddd6fe" stroke="#6d28d9" class="b"/><text x="245" y="225" class="l">输入上下文</text><text x="245" y="252" class="s">Prompt / 历史消息</text><path d="M245 270 L245 315" class="ar"/><ellipse cx="245" cy="345" rx="95" ry="32" fill="#dcebd9" stroke="#047857" class="b"/><text x="245" y="351" class="l">文本回答</text><rect x="520" y="95" width="410" height="290" rx="22" fill="#f8fafc" stroke="#64748b" class="b"/><text x="725" y="135" class="l">Agent 系统</text><rect x="565" y="175" width="145" height="65" rx="14" fill="#dbeafe" stroke="#1e3a5f" class="b"/><text x="637" y="213" class="l">状态</text><rect x="740" y="175" width="145" height="65" rx="14" fill="#fed7aa" stroke="#c2410c" class="b"/><text x="812" y="213" class="l">工具</text><rect x="565" y="280" width="145" height="65" rx="14" fill="#fef3c7" stroke="#b45309" class="b"/><text x="637" y="318" class="l">记忆</text><rect x="740" y="280" width="145" height="65" rx="14" fill="#dcebd9" stroke="#047857" class="b"/><text x="812" y="318" class="l">反馈循环</text><path d="M710 207 L740 207" class="ar"/><path d="M812 240 L812 280" class="ar"/><path d="M740 312 L710 312" class="ar"/><path d="M637 280 L637 240" class="ar"/><text x="500" y="430" class="s">Agent = 模型 + 状态 + 工具 + 执行边界 + 反馈循环</text></svg>
