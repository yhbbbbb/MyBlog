<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">软件开发任务 SOP</title><desc id="desc">开发任务从确认需求开始，依次经过设计、实现、自动检查、评审验收和发布，失败时回到修复环节。</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 Q5 4 10 6 Q5 8 1 11" fill="none" stroke="#4d5555" stroke-width="1.8" marker-end="url(#arrow)"/></marker><filter id="pencil"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="1" seed="22"/><feDisplacementMap in="SourceGraphic" scale="1.1"/></filter><style>.title{font:700 28px 'Segoe Print','Microsoft YaHei',sans-serif;fill:#273333;text-anchor:middle}.label{font:600 18px 'Segoe Print','Microsoft YaHei',sans-serif;fill:#303b3b;text-anchor:middle}.small{font:16px 'Segoe Print','Microsoft YaHei',sans-serif;fill:#536060;text-anchor:middle}.box{stroke:#435051;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;filter:url(#pencil)}.arrow{fill:none;stroke:#4d5555;stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow)}.back{fill:none;stroke:#8a6c50;stroke-width:2.4;stroke-dasharray:9 7;stroke-linecap:round;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="600" rx="18" fill="#fffdf8"/><text x="600" y="50" class="title">一次开发任务的标准执行流程</text>
  <rect x="65" y="95" width="1070" height="420" rx="25" fill="#f6f2e9" stroke="#cbbda7" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="105" y="190" width="160" height="90" rx="16" fill="#d9e9e7" class="box"/><text x="185" y="228" class="label">确认目标</text><text x="185" y="255" class="small">验收条件</text>
  <rect x="330" y="190" width="160" height="90" rx="16" fill="#dbe7f3" class="box"/><text x="410" y="228" class="label">设计方案</text><text x="410" y="255" class="small">风险与边界</text>
  <rect x="555" y="190" width="160" height="90" rx="16" fill="#e5dcef" class="box"/><text x="635" y="228" class="label">实现与测试</text><text x="635" y="255" class="small">代码与样例</text>
  <polygon points="850,180 950,235 850,290 750,235" fill="#f2dfb9" class="box"/><text x="850" y="232" class="label">检查通过？</text>
  <rect x="970" y="190" width="120" height="90" rx="16" fill="#dcebd9" class="box"/><text x="1030" y="228" class="label">评审</text><text x="1030" y="255" class="small">验收发布</text>
  <path d="M265 235 L330 235" class="arrow"/><path d="M490 235 L555 235" class="arrow"/><path d="M715 235 L750 235" class="arrow"/><path d="M950 235 L970 235" class="arrow"/>
  <text x="960" y="215" class="small">是</text><path d="M850 290 C850 420 650 455 635 280" class="back"/><text x="730" y="420" class="small">否：修复并重新检查</text>
  <rect x="260" y="370" width="220" height="70" rx="16" fill="#fff8df" class="box"/><text x="370" y="400" class="label">异常分支</text><text x="370" y="425" class="small">超时 / 权限 / 数据错误</text>
  <path d="M635 280 L480 370" class="back"/>
</svg>
