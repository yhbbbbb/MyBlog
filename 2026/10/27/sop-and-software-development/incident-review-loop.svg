<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">故障处理与 SOP 复盘闭环</title><desc id="desc">故障发生后先告警、止损和恢复，再收集证据、分析根因、修复并更新测试监控和 SOP。</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 Q5 4 10 6 Q5 8 1 11" fill="none" stroke="#4d5555" stroke-width="1.8"/></marker><filter id="pencil"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="1" seed="23"/><feDisplacementMap in="SourceGraphic" scale="1.1"/></filter><style>.title{font:700 28px 'Segoe Print','Microsoft YaHei',sans-serif;fill:#273333;text-anchor:middle}.label{font:600 18px 'Segoe Print','Microsoft YaHei',sans-serif;fill:#303b3b;text-anchor:middle}.small{font:16px 'Segoe Print','Microsoft YaHei',sans-serif;fill:#536060;text-anchor:middle}.box{stroke:#435051;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;filter:url(#pencil)}.arrow{fill:none;stroke:#4d5555;stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow)}.feedback{fill:none;stroke:#8a6c50;stroke-width:2.4;stroke-dasharray:9 7;stroke-linecap:round;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="570" rx="18" fill="#fffdf8"/><text x="600" y="50" class="title">故障处理、恢复与 SOP 复盘</text>
  <circle cx="600" cy="300" r="215" fill="#f6f2e9" stroke="#cbbda7" stroke-width="2" stroke-dasharray="10 8"/><text x="600" y="305" class="label">证据驱动的复盘</text><text x="600" y="333" class="small">不追责，修复系统</text>
  <rect x="495" y="100" width="210" height="75" rx="16" fill="#f3d6d0" class="box"/><text x="600" y="130" class="label">告警与止损</text><text x="600" y="157" class="small">确认影响范围</text>
  <rect x="850" y="245" width="210" height="75" rx="16" fill="#d9e9e7" class="box"/><text x="955" y="275" class="label">恢复服务</text><text x="955" y="302" class="small">回滚 / 降级</text>
  <rect x="495" y="410" width="210" height="75" rx="16" fill="#dbe7f3" class="box"/><text x="600" y="440" class="label">收集证据</text><text x="600" y="467" class="small">日志 / 指标 / 时间线</text>
  <rect x="140" y="245" width="210" height="75" rx="16" fill="#e5dcef" class="box"/><text x="245" y="275" class="label">根因分析</text><text x="245" y="302" class="small">为什么没被发现？</text>
  <path d="M705 138 C810 145 860 200 900 245" class="arrow"/><path d="M955 320 C900 390 810 420 705 442" class="arrow"/><path d="M495 442 C400 420 330 370 300 320" class="arrow"/><path d="M245 245 C300 170 390 135 495 138" class="arrow"/>
  <rect x="400" y="515" width="400" height="38" rx="12" fill="#fff8df" class="box"/><text x="600" y="541" class="small">更新代码、测试、监控、培训与 SOP</text><path d="M600 485 L600 515" class="feedback"/>
</svg>
