# Hexo 站点配置：用于 yhbbbbb/MyBlog GitHub Pages 项目站点
title: WantBeing # 网站大标题，浏览器标签页、首页标题
subtitle: 坚持学习&持续成长 # 网站副标题，首页标题下方的描述
description: 记录自己对技术的学习和项目实践，作为持续更新的技术作品集。
keywords: Python, 自动化, 工程实践, 技术博客, 项目经验
author: yhbbbbb
language: zh-CN
timezone: Asia/Shanghai

# 项目仓库页面必须保留仓库名路径；自定义域名时改为 '/'
url: https://yhbbbbb.github.io/MyBlog
root: /MyBlog/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

theme: next
# 新文章文件名：日期-项目 slug.md
new_post_name: :year-:month-:day-:title.md
# 只使用 Front Matter 的 updated，避免 CI 检出时间被误认为文章更新时间
updated_option: date
default_layout: post
filename_case: 0
render_drafts: false
post_asset_folder: true   # ✅ 开启文章资源文件夹！新建文章会生成同名文件夹，图片放这里，非常适合博客插图
relative_link: false
future: true    # 允许发布未来日期的文章
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''
marked:
  gfm: true
  breaks: false
  pedantic: false
  smartLists: true
  smartypants: false

# 本地预览及构建配置
## Github Actions CI 自动部署（推荐），**deploy 配置可以保持为空，不需要改动**
deploy:
  type: ''
