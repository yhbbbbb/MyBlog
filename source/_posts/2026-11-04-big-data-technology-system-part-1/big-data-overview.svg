<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">大数据技术体系总览架构图</title><desc id="desc">从数据源和存储，到批流计算、治理、数仓数据湖和数据服务，再到业务应用。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 Q5 4 10 6 Q5 8 1 11" fill="none" stroke="#4d5555" stroke-width="1.8"/></marker><style>.t{font:700 27px 'Segoe Print','Microsoft YaHei',sans-serif;fill:#273333;text-anchor:middle}.l{font:600 18px 'Segoe Print','Microsoft YaHei',sans-serif;fill:#303b3b;text-anchor:middle}.s{font:15px 'Segoe Print','Microsoft YaHei',sans-serif;fill:#536060;text-anchor:middle}.b{stroke:#435051;stroke-width:2.4;stroke-linejoin:round}.ar{fill:none;stroke:#4d5555;stroke-width:2.5;marker-end:url(#a);stroke-linecap:round}.g{fill:none;stroke:#8a6c50;stroke-width:2.2;stroke-dasharray:9 7;marker-end:url(#a)}</style></defs><rect width="1200" height="650" rx="18" fill="#fffdf8"/><text x="600" y="45" class="t">大数据技术体系总览</text><rect x="45" y="75" width="1110" height="530" rx="25" fill="#f6f2e9" stroke="#cbbda7" stroke-width="2" stroke-dasharray="10 8"/><rect x="90" y="120" width="1020" height="70" rx="16" fill="#d9e9e7" class="b"/><text x="600" y="150" class="l">数据源</text><text x="600" y="175" class="s">业务数据库 · 日志 · 消息 · 文件 · IoT · 第三方 API</text><rect x="90" y="240" width="300" height="92" rx="16" fill="#dbe7f3" class="b"/><text x="240" y="278" class="l">存储层</text><text x="240" y="305" class="s">HDFS · 对象存储 · Kafka · HBase</text><rect x="450" y="240" width="300" height="92" rx="16" fill="#e5dcef" class="b"/><text x="600" y="278" class="l">计算层</text><text x="600" y="305" class="s">MapReduce · Spark · Flink · Trino</text><rect x="810" y="240" width="300" height="92" rx="16" fill="#f2dfb9" class="b"/><text x="960" y="278" class="l">治理层</text><text x="960" y="305" class="s">目录 · 质量 · 血缘 · 权限 · 生命周期</text><rect x="90" y="390" width="300" height="92" rx="16" fill="#dcebd9" class="b"/><text x="240" y="428" class="l">数据仓库</text><text x="240" y="455" class="s">ODS · DWD · DWS · ADS</text><rect x="450" y="390" width="300" height="92" rx="16" fill="#e7dfd2" class="b"/><text x="600" y="428" class="l">数据湖 / 湖仓</text><text x="600" y="455" class="s">Parquet · Iceberg · Delta · Hudi</text><rect x="810" y="390" width="300" height="92" rx="16" fill="#f0dcdc" class="b"/><text x="960" y="428" class="l">数据服务</text><text x="960" y="455" class="s">指标 · 标签 · API · 特征</text><rect x="210" y="530" width="780" height="55" rx="14" fill="#fff8df" class="b"/><text x="600" y="564" class="l">业务应用：报表 · 推荐 · 风控 · 运营 · 决策</text><path d="M240 190 L240 240" class="ar"/><path d="M600 190 L600 240" class="ar"/><path d="M960 190 L960 240" class="ar"/><path d="M240 332 L240 390" class="ar"/><path d="M600 332 L600 390" class="ar"/><path d="M960 332 L960 390" class="ar"/><path d="M240 482 L350 530" class="ar"/><path d="M600 482 L600 530" class="ar"/><path d="M960 482 L850 530" class="ar"/><path d="M960 220 C830 120 400 110 240 220" class="g"/><text x="600" y="110" class="s">治理贯穿全链路</text></svg>
