<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">智能体感知思考行动反馈闭环</title><desc id="desc">智能体读取目标和环境，经过模型决策后调用工具，读取反馈并更新状态，直到完成或停止。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 Q5 4 10 6 Q5 8 1 11" fill="none" stroke="#64748b" stroke-width="2"/></marker><style>.t{font:700 28px 'Microsoft YaHei',sans-serif;fill:#1e40af;text-anchor:middle}.l{font:600 20px 'Microsoft YaHei',sans-serif;fill:#374151;text-anchor:middle}.s{font:16px 'Microsoft YaHei',sans-serif;fill:#64748b;text-anchor:middle}.b{stroke-width:2.5}.ar{fill:none;stroke:#64748b;stroke-width:2.8;marker-end:url(#a);stroke-linecap:round}.loop{fill:none;stroke:#047857;stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#a)}</style></defs><rect width="1000" height="560" rx="18" fill="#fffdf8"/><text x="500" y="45" class="t">Agent 的感知—思考—行动—反馈闭环</text><ellipse cx="500" cy="285" rx="125" ry="72" fill="#ddd6fe" stroke="#6d28d9" class="b"/><text x="500" y="278" class="l">LLM 决策核心</text><text x="500" y="308" class="s">选择下一步动作</text><rect x="80" y="130" width="190" height="100" rx="18" fill="#dbeafe" stroke="#1e3a5f" class="b"/><text x="175" y="170" class="l">感知</text><text x="175" y="198" class="s">消息 · 文档 · 状态</text><rect x="730" y="130" width="190" height="100" rx="18" fill="#fed7aa" stroke="#c2410c" class="b"/><text x="825" y="170" class="l">行动</text><text x="825" y="198" class="s">工具 · API · 文件</text><rect x="730" y="390" width="190" height="100" rx="18" fill="#dcebd9" stroke="#047857" class="b"/><text x="825" y="430" class="l">反馈</text><text x="825" y="458" class="s">结果 · 错误 · 观察</text><rect x="80" y="390" width="190" height="100" rx="18" fill="#fef3c7" stroke="#b45309" class="b"/><text x="175" y="430" class="l">状态更新</text><text x="175" y="458" class="s">记忆 · 进度 · 限制</text><path d="M270 180 C350 180 370 230 400 250" class="ar"/><path d="M600 250 C660 220 680 180 730 180" class="ar"/><path d="M825 230 L825 390" class="ar"/><path d="M730 440 C620 440 620 360 560 335" class="ar"/><path d="M400 335 C350 360 330 440 270 440" class="ar"/><path d="M175 390 C175 310 290 285 375 285" class="loop"/><text x="500" y="530" class="s">循环在“任务完成、达到上限、超时或需要人工介入”时停止</text></svg>
