<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">数据存算管用四层架构</title><desc id="desc">存储、计算、治理和应用四层架构，治理以贯穿方式约束其他层。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 Q5 4 10 6 Q5 8 1 11" fill="none" stroke="#4d5555" stroke-width="1.8"/></marker><style>.t{font:700 27px 'Segoe Print','Microsoft YaHei',sans-serif;fill:#273333;text-anchor:middle}.l{font:600 19px 'Segoe Print','Microsoft YaHei',sans-serif;fill:#303b3b;text-anchor:middle}.s{font:15px 'Segoe Print','Microsoft YaHei',sans-serif;fill:#536060;text-anchor:middle}.b{stroke:#435051;stroke-width:2.4}.g{fill:none;stroke:#8a6c50;stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#a)}</style></defs><rect width="1200" height="540" rx="18" fill="#fffdf8"/><text x="600" y="45" class="t">数据存、算、管、用四层协同</text><rect x="100" y="90" width="930" height="80" rx="16" fill="#dcebd9" class="b"/><text x="565" y="125" class="l">用：数据产品与业务应用</text><text x="565" y="153" class="s">报表 · 指标 · API · 标签 · 特征 · 决策</text><rect x="100" y="205" width="930" height="80" rx="16" fill="#e5dcef" class="b"/><text x="565" y="240" class="l">算：批流一体与查询引擎</text><text x="565" y="268" class="s">Spark · Flink · Trino · SQL · ML</text><rect x="100" y="320" width="930" height="80" rx="16" fill="#dbe7f3" class="b"/><text x="565" y="355" class="l">存：数据库、数据湖与数仓</text><text x="565" y="383" class="s">OLTP · 对象存储 · HDFS · Iceberg · Parquet</text><rect x="100" y="435" width="930" height="60" rx="16" fill="#f2dfb9" class="b"/><text x="565" y="472" class="l">管：目录 · 质量 · 血缘 · 权限 · 生命周期</text><path d="M1060 120 L1060 465" class="g"/><text x="1090" y="300" class="s" transform="rotate(90 1090 300)">治理贯穿每一层</text></svg>
