# NexT 主题站点级覆盖配置，避免直接修改主题子模块配置
scheme: Gemini
darkmode: true

# 顶部导航栏
menu:
  首页: / || fa fa-home
  归档: /archives/ || fa fa-archive
  分类: /categories/ || fa fa-th
  标签: /tags/ || fa fa-tags
  关于: /about/ || fa fa-user
menu_settings:
  badges: false
  tags: true

# 侧栏与社交链接
avatar:
  url: 'https://avatars.githubusercontent.com/u/153179554?s=400&u=a84a8f8f5cc8c112034e4d253d56f2bb13ec80c0&v=4'
  rounded: true
  opacity: 1
social:
  GitHub: https://github.com/yhbbbbb || fab fa-github
site_state: true

# Mermaid 流程图与架构图
mermaid:
  enable: true
  theme:
    light: default
    dark: dark

# 文章目录
toc:
  enable: true
  number: true
  wrap: false
  expand_all: false
  max_depth: 3

# 代码块样式与复制按钮
codeblock:
  theme:
    light: github
    dark: github-dark
  copy_button:
    enable: true
    show_result: true
  fold:
    enable: false

# 数学公式按需启用 KaTeX
math:
  mathjax:
    enable: false
  katex:
    enable: false

# 阅读进度和回到顶部
reading_progress:
  enable: true
back2top:
  enable: true
  sidebar: false

# 页脚信息
footer:
  since: 2026
  icon:
    name: fa fa-heart
    animated: false
    color: '#ff0000'
  copyright: yhbbbbb

# 开启 light-dark() 配色变量，供手动明暗切换控制 color-scheme
lightdark:
  enable: true
  check_supports: true

# 在页面 body 结束前载入站点自定义切换按钮
custom_file_path:
  bodyEnd: source/_data/body-end.njk

# 启用 NexT 内置的本地搜索弹窗
local_search:
  enable: true
  top_n_per_article: 1
  unescape: false
  preload: false

# 启用 Busuanzi 网站访问统计
busuanzi_count:
  enable: true
  total_visitors: true # 网站访客数（UV）
  total_visitors_icon: fa fa-user
  total_views: true # 网站总浏览量（PV）
  total_views_icon: fa fa-eye
  post_views: true # 单篇文章阅读量（PV）
  post_views_icon: far fa-eye
